name: Deploy ke Hosting (SSH + Sync Build)

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # --- STEP FRONTEND (Dikerjakan di komputer GitHub) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cp .env.example .env
          npm install
          npm run build

      # --- STEP DEPLOY (Kirim kode + Hasil Build ke Hosting) ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/pos.kasir.hanifcahyo.my.id

            # Ambil kode backend terbaru
            git fetch origin development
            git reset --hard origin/development

            # Update dependencies backend
            /usr/local/bin/php composer.phar install --no-dev --optimize-autoloader

            # Jalankan migrasi
            /usr/local/bin/php artisan migrate --force

      # --- STEP SYNC BUILD (Kirim folder public/build saja) ---
      - name: Sync Build Folder to Hosting
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: "~/pos.kasir.hanifcahyo.my.id"
          overwrite: true

      - name: Finalize (Clear Cache)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/pos.kasir.hanifcahyo.my.id
            /usr/local/bin/php artisan config:cache
            /usr/local/bin/php artisan route:cache
            /usr/local/bin/php artisan view:cache
            # Baris pengaman tambahan:
            chmod -R 775 storage bootstrap/cache public/build
